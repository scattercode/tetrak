# Build the documentation site as a check. Publishing is Cloudflare's job.
#
# The site is deployed to Cloudflare Pages at https://tetrak.dev/, which builds
# from this repository on every push to main. Nothing here deploys: this
# workflow exists so that a broken site fails review rather than main, matching
# the build-check shape used by velostevie and scattercode.dev.
#
# It previously published to GitHub Pages via configure-pages /
# upload-pages-artifact / deploy-pages. That is gone, along with the pages and
# id-token permissions it needed -- scattercode.github.io/ocr-pipeline/ is
# retired and the repository's Pages source can be set back to None.
#
# Cloudflare Pages settings this mirrors:
#   Build command      pip install -e . && cd site && npm ci && npm run build
#   Output directory   site/public
#   Root directory     /
#   NODE_VERSION       24
#   PYTHON_VERSION     3.11
#
# `pip install -e .` is not optional: prebuild regenerates
# content/reference/api.md by importing the installed package, and that file is
# gitignored rather than committed. The core dependency set is deliberately
# light (Pillow, pytesseract, pdf2image, python-dotenv) -- the heavy OCR
# backends are extras and are not installed for a docs build.
name: Docs

on:
  push:
    branches: [main]
    # The site build reads nothing from the Sphinx sources -- docs/ is the
    # separate CLI/API reference with its own workflow -- so changes confined
    # to it cannot break this check.
    paths-ignore:
      - "docs/**"
  # No path filter on pull_request: these are required checks, and a
  # workflow filtered out by path never starts, so never reports, and leaves
  # the pull request blocked.
  pull_request:
  workflow_dispatch:

# A push superseding an in-flight run makes that run's answer worthless;
# cancelling it saves the minutes -- and this is the repository's most
# expensive per-run check.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # Named for what it builds. Two workflows here used to call this job
  # `build`, and a required status check matches on the context string, so
  # while both shared the name neither could be gated on. The Sphinx one is
  # `api-docs-build`; this is the Hugo site at tetrak.dev.
  site-build:
    runs-on: ubuntu-latest
    # The job runs in about two and a half minutes. The timeout is not there to
    # catch it getting slower, but to catch it stopping: `playwright install`
    # has twice hung indefinitely fetching browsers, and with GitHub's default
    # of 360 minutes that blocks the pull request for six hours and burns the
    # runner minutes to match. Fifteen turns a silent hang into a fast, obvious
    # failure that a re-run clears.
    timeout-minutes: 15
    # The Hugo site lives in site/; the Python package it documents is at the
    # repository root. Everything npm-related runs from site/, and the two
    # steps that do not (checkout, pip install) say so explicitly.
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
        with:
          # hugo.toml sets enableGitInfo, which reads commit dates from history.
          # The default shallow clone leaves it with one commit, so every page
          # would report the same Lastmod -- wrong rather than absent. Matches
          # scattercode.dev.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: site/.nvmrc
          cache: npm
          cache-dependency-path: site/package-lock.json

      # The API reference is generated by importing the package and reading its
      # docstrings, so the package has to be installed, not just the site deps.
      # Without it the generator now exits 1 rather than publishing a page of
      # "Not documented" placeholders behind a green build.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package
        # From the repository root: pyproject.toml is there, and the API
        # reference is generated by importing the installed package.
        working-directory: .
        run: pip install -e .

      - name: Install the site toolchain
        run: npm ci

      # The build cannot see a page that renders wrongly but parses fine --
      # which is how the site once shipped nineteen dead images and two pages of
      # literal mkdocs syntax. These check what a reader actually receives.
      #
      # Deliberately before the build. Playwright starts `hugo server`, and the
      # server writes into public/ with its own localhost baseURL: running it
      # after the build replaced every absolute URL in the artefact with
      # http://localhost:1313, which shipped nine alias pages redirecting
      # visitors to their own machine. `npm run start` now renders to memory,
      # and building last means the uploaded output is never something a server
      # has touched.
      # ESLint, Stylelint and markdownlint over the site sources. Added after
      # a broken eslint-disable directive reached a commit: the pre-commit hook
      # lints Python only, and nothing here ran `npm run lint`, so a lint error
      # in site/scripts/ could merge behind a green build.
      - name: Lint
        run: npm run lint

      # No `--with-deps`. That flag apt-installs Chromium's system libraries,
      # and measured on this job it took 536 seconds of a 591-second run -- an
      # order of magnitude more than everything else combined, including the
      # browser download it is usually assumed to be cheaper than. GitHub's
      # ubuntu-latest image already ships those libraries; `--with-deps` exists
      # for bare containers, which this is not.
      #
      # If the runner image ever stops carrying them, Chromium fails to launch
      # and the smoke tests fail on the spot. That is a loud failure rather
      # than a wrong result, and the fix is to put the flag back.
      #
      # The cache then covers what is genuinely left: a ~150MB download. Its
      # key hashes the lockfile rather than the Playwright version, because
      # reading the version out needs a step of its own and the failure modes
      # are not symmetric -- an unrelated lockfile change costs one extra
      # download, where a stale key would pair a cached browser with a client
      # that no longer matches it.
      - name: Cache the Playwright browser
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('site/package-lock.json') }}

      - name: Install the browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium

      - name: Browser smoke tests
        run: npx playwright test
        env:
          CI: "true"

      # Every committed mermaid SVG is named for a hash of its own source, so a
      # missing file means an edited diagram whose render was never committed.
      # Cloudflare's build image has no browser, so it cannot draw one: if this
      # is not caught here, the page ships its diagram as raw text.
      - name: Diagrams are rendered and committed
        run: node scripts/render-mermaid.mjs --check

      # `npm run build` regenerates content/reference/api.md and then runs Hugo.
      # Hugo comes from the hugo-extended npm package, so there is no separate
      # install step and the version is pinned in package-lock.json.
      #
      # HUGO_BASEURL matches what Cloudflare sets, so the check builds the same
      # absolute URLs the deploy will.
      - name: Build
        run: npm run build
        env:
          HUGO_BASEURL: https://tetrak.dev/
