name: Sphinx docs

# Two jobs in one file: a build check, and a deploy that only Release (or a
# hand-run dispatch) can start.
#
# The push and pull_request paths build the reference and stop. They used to
# deploy as well, and that published whatever version hatch-vcs derived from
# the commit under test. A merge that cuts no release (chore, ci, docs, test)
# lands an untagged commit, which hatch-vcs honestly versions as X.Y.Z.devN
# -- so after the first post-split chore merge the page read "tetrak
# 5.14.2.dev2 documentation" with nothing due to overwrite it until the next
# release.
#
# Deploying from a tagged commit was the first fix, and not enough: Release
# pushes its tag before it builds and publishes the wheel, so a deploy
# triggered by that push could run while publication was still pending, and
# would leave the reference ahead of PyPI if publication failed. The deploy
# is therefore a job in release.yml, run after the publish job succeeds,
# which calls this workflow with the tag it just released. The published
# reference then matches the version that is on PyPI, because it cannot
# deploy before that is true.

on:
  push:
    branches: [main]
    # The Sphinx reference reads docs/ and the package's docstrings; the
    # Hugo site never enters it.
    paths-ignore:
      - "site/**"
  # No path filter on pull_request: these are required checks, and a
  # workflow filtered out by path never starts, so never reports, and leaves
  # the pull request blocked.
  pull_request:
  # Release calls this after the wheel is on PyPI. The caller's event is its
  # push to main, so the run deploys under refs/heads/main -- the only ref
  # the github-pages environment's branch policy admits -- while building
  # from the tag.
  workflow_call:
    inputs:
      tag:
        description: The release tag to build and deploy
        required: true
        type: string
  # A redeploy by hand, for a release whose docs job was skipped or failed:
  #
  #   gh workflow run sphinx-docs.yml --ref main -f tag=5.14.1
  #
  # The tag is an input rather than the ref for the same reason: a dispatch
  # against the tag itself builds the right thing and is then refused by the
  # environment, which was verified the hard way.
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to build and deploy (for example 5.14.1)
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Two regimes in one expression. Deploying runs keep the original
# serialised `pages` group with no cancellation, so a deploy is never killed
# mid-flight. Pull-request builds deploy nothing and get a per-ref group with
# cancellation, so a review-fix push stops the superseded build instead of
# paying for it. (A run called from Release also sits in Release's own
# `release` group, which already serialises releases.)
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('sphinx-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Named for what it builds, not for the verb. The Docs workflow also has a
  # job called `build`, and a required status check matches on the context
  # string -- so while both were called `build`, requiring it matched two
  # different checks and could not be relied on to gate either.
  api-docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag when deploying; empty on push and pull_request, which
          # actions/checkout reads as "the commit that triggered the run".
          ref: ${{ inputs.tag }}
          # hatch-vcs derives the version from `git describe --tags`. The
          # default shallow clone has no tags reachable, so conf.py's
          # `tetrak_ocr._version` falls back to setuptools_scm's "no tag
          # found" guess (0.1.dev1+g<sha>) instead of the real release.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install the package and Sphinx toolchain
        run: pip install -e '.[apidocs]'

      # The input could be a branch name or a typo, and actions/checkout
      # would check either out without complaint. The build has to report
      # exactly the version asked for, or the deploy is refused.
      - name: Check the build reports the tag it was asked for
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          git describe --exact-match --tags HEAD
          python -c "import os, tetrak_ocr as t; v = os.environ['TAG'].removeprefix('v'); assert t.__version__ == v, (t.__version__, v); print('building', t.__version__)"

      - name: Build
        run: sphinx-build -W -b html docs docs/_build/html

      - uses: actions/configure-pages@v6
        if: inputs.tag != ''

      - uses: actions/upload-pages-artifact@v5
        if: inputs.tag != ''
        with:
          path: docs/_build/html

  deploy:
    needs: api-docs-build
    # `needs.api-docs-build`, not `needs.build`. Renaming the job to
    # disambiguate the required status check left this reference pointing at
    # a job that no longer exists, so it resolved to nothing, never equalled
    # 'true', and silently disabled every post-release deploy -- the exact
    # path that exists to publish the docs at a tag rather than one commit
    # past it. Nothing failed; the docs just stopped updating after releases.
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
