# Not yet connected to Read the Docs -- the repo is private and RTD's free
# tier requires public. Kept ready for when that changes; see docs/conf.py
# and .github/workflows/sphinx-docs.yml for the GitHub Pages build this
# mirrors.
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
sphinx:
  configuration: docs/conf.py
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - apidocs
