# Findings the Trivy scan in ci.yml is told to pass over. Each entry names
# one package version, never a whole CVE, so a newer copy of the same package
# is still checked. Give the reason and the date it was reviewed.
vulnerabilities:
  # The fix is in soupsieve 4.0, which needs Python 3.11.5 or later. The lock
  # file keeps 2.10 only for Python 3.11.0 to 3.11.4, where no fixed release
  # exists. Remove this entry when the minimum Python version passes 3.11.4.
  # Reviewed 2026-11-13.
  - id: CVE-2026-126190
    purls:
      - "pkg:pypi/soupsieve@2.10"
    statement: No fixed release for Python below 3.11.5; later Pythons lock 4.1
