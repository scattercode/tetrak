# Matches scattercode.dev, with two additions for this repo.
ignores:
  - ../CLAUDE.md
  # Sphinx output and the autosummary stubs it generates; both gitignored.
  - ../docs/_build/**
  - ../docs/generated/**

config:
  MD013: false
  MD031: false
  MD032: false
  MD060: false
  # Keep a Changelog repeats "### Added" etc. under each version heading, and
  # CHANGELOG.md is generated by git-cliff -- it cannot be edited to satisfy a
  # linter.
  MD024:
    siblings_only: true
  # Pages open with a kicker and title from front matter, so the first heading
  # in the body is an h2 by design.
  MD041: false
  # The card grids are raw <div>s wrapping a markdown list -- the one place this
  # site needs inline HTML, because there is no shortcode for a grid.
  MD033: false
  # Those grids set their items as `-   item`, so continuation paragraphs line
  # up under the content column. Normalising the marker would reflow every card.
  MD030: false
