# Top navigation: Products (a dropdown of the three tools, whose own label is
# the overview page), Services, Research, Articles, and the page saying who is
# behind it all.
#
# Restructured October 2026 (brief 017). Until then the site was about one
# tool and the nav said so: "What it is" was the OCR pitch, and Tutorial and
# Reference sat in the top row. There are now three open-source tools and a
# service side, so the nav groups the tools under Products and the OCR page
# links to its own tutorial and reference, which moved under /ocr/ with it.
# Restructured before that in August 2026, when the previous eight-entry nav
# spread the research story across four tabs. The count is deliberately not
# written down here: it was, and the first entry added afterwards left the
# header saying "five".
#
# A child entry names its parent's identifier. The header partial renders a
# parent with children as a link plus a disclosure button; the phone menu
# shows the children indented under it. The parent must keep its pageRef so
# the overview is reachable without the dropdown.

[[main]]
  name = "Products"
  identifier = "products"
  pageRef = "/products"
  weight = 10

[[main]]
  name = "Tetrak OCR"
  parent = "products"
  pageRef = "/ocr"
  weight = 1

[[main]]
  name = "Armenian text recognition"
  parent = "products"
  pageRef = "/armenian-ocr"
  weight = 2

[[main]]
  name = "Transliteration"
  parent = "products"
  pageRef = "/translit"
  weight = 3

# Beside Products rather than at the end: the split between the free tools
# and the paid work is the first thing a visitor should be able to see.
[[main]]
  name = "Services"
  pageRef = "/services"
  weight = 20

[[main]]
  name = "Research"
  pageRef = "/research"
  weight = 30

# Added August 2026 with the articles section. It sits next to Research
# because it is the same kind of thing: writing about the problem and about
# the tools' progress, alongside the fixed evidence.
[[main]]
  name = "Articles"
  pageRef = "/articles"
  weight = 40

# Added August 2026. The one page that says who is behind the work, and
# burying that in the footer is how an unfamiliar reader fails to find it.
[[main]]
  name = "About"
  pageRef = "/about"
  weight = 50
