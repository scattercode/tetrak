## --- What the evidence says --------------------------------------------------
## Three claims, set as pull quotes on the page and as the summary slide in the
## deck. No figures: the deck's old version asserted "~0.98 on average" for
## Claude, which had been true of an earlier run and was not true of this one.

[[finding]]
title = "Claude sets a ceiling, and is not a competitor"
body = "It generated the reference transcripts every other engine is scored against, including its own. Reading its column as a win is reading the wrong thing. What it does tell you is roughly how much of each document is legible at all."

[[finding]]
title = "No single local engine is strong across the corpus"
body = "Different engines win on different documents, and the winners are not close to each other. There is no setting you can choose once and be right about, which is the finding that decided the architecture."

[[finding]]
title = "Choosing per file closes most of the gap"
body = "auto-local runs the engines eligible for each file, scores the transcripts without a reference, and keeps the best. It beats every individual local engine on both metrics, entirely offline and free — and it is still losing ground to an oracle that knows the answer."

## --- Choosing for your own material -------------------------------------------
## Kept in step with the table on content/_index.md and the fuller one under
## "Choosing a tool for your own material" in content/research/_index.md.

[[recommendation]]
material = "Clean printed captions, postcards, labels"
engine = "tesseract-auto"
second = "easyocr"
why = "Close to the ceiling, free, offline and fast"

[[recommendation]]
material = "Multi-column newsprint and magazines"
engine = "claude"
second = "marker"
why = "Reading order is the whole problem, and only layout understanding solves it"

[[recommendation]]
material = "Decorative, hand-lettered, ornamental type"
engine = "claude"
second = ""
why = "Nothing local reads it"

[[recommendation]]
material = "Multi-page PDFs"
engine = "marker"
second = "tesseract"
why = "EasyOCR and PaddleOCR cannot read PDFs at all"

[[recommendation]]
material = "Mixed material, run unattended"
engine = "auto-local"
second = ""
why = "Runs the viable local engines and keeps the best transcript"

[[recommendation]]
material = "Anything confidential"
engine = "auto-local"
second = "tesseract-auto"
why = "Everything stays on the machine; no API call"

## --- Still open ---------------------------------------------------------------

[[question]]
title = "The selection heuristic leaves accuracy on the table"
body = "auto-local’s scorer loses ground against an oracle that knows which transcript is best. That is a scoring weight rather than an engine limitation, and it is the cheapest accuracy work available."

[[question]]
title = "The auto-configuration bands are overfitted"
body = "They were fitted against most of this corpus and need re-fitting on a wider set before they can be trusted elsewhere."

[[question]]
title = "The ground truth is machine-generated"
body = "Human-checked reference transcripts would remove the benchmark’s central weakness, and would let Claude be measured rather than assumed."

[[question]]
title = "Nothing here generalises beyond archival print of this era"
body = "Same period, same condition, same script. Whether the pipeline holds up on other scripts is untested; an open Armenian Tesseract model exists and would make the cheapest first experiment."

[[question]]
title = "Rights, before anything else"
body = "Would the rights attached to a given collection permit sending its scans to a third-party service at all? Where the answer is no, the local path is not a preference, it is the only option."
