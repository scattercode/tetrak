## The research walkthrough, in one place.
##
## Two artefacts render this file: the site page at /research/walkthrough/
## (site/layouts/research/walkthrough.html) and the slide deck
## (tools/generate_presentation.py). Hugo reads it natively as
## `site.Data.walkthrough`; Python reads it with stdlib `tomllib`, which is why
## it is TOML rather than YAML -- neither side needs a dependency for it.
##
## THIS FILE HOLDS PROSE AND STRUCTURE ONLY. Every figure comes from
## evaluation/ocr/benchmark.csv at render time, in both media, the same way the
## {{< benchmark >}} shortcode and tools/generate_benchmark_chart.py already
## work. The deck used to carry sentences like "recall runs 0.71 to 0.91"
## typed in by hand, and they went stale the first time the harness re-ran.
## Write qualitatively here; let the numbers arrive from the CSV beside it.
##
## Document titles, subtitles and challenges agree with
## site/content/reference/corpus.md deliberately -- the same nine items should
## be described the same way wherever they appear.

[meta]
title = "OCR for historical archives"
subtitle = "A comparison of text recognition engines"
standfirst = "Which OCR engine should you point at a box of archive scans? We built a fixed corpus of Los Angeles stage and picture-palace ephemera, generated reference transcripts, and measured every engine we could install against every document. This is that work, in order."
byline = "Stephen Masters · Yvette Mankerian"
footer = "Tetrak OCR · tetrak.dev"
date = "August 2026"

## --- The spine ---------------------------------------------------------------
## Five beats. The deck gives each one an agenda row and a section marker; the
## page sets the numeral oversized in the margin.

[[chapter]]
number = "1"
title = "The challenge"
blurb = "Why OCR matters for archival work, and what makes historical documents difficult to digitise."

[[chapter]]
number = "2"
title = "The engines"
blurb = "What exists, how each one works, and the difference between pattern matching, neural recognition and layout understanding."

[[chapter]]
number = "3"
title = "The corpus"
blurb = "Nine real documents, chosen to span the failure modes that matter in archive digitisation rather than to flatter anything."

[[chapter]]
number = "4"
title = "The results"
blurb = "What the measurements say: which engine to reach for, and where each one falls down."

[[chapter]]
number = "5"
title = "What follows"
blurb = "The findings that survived, and the questions still open."

## --- Why this is hard --------------------------------------------------------

[[challenge]]
title = "Faded ink and poor contrast"
body = "Aged paper and aged ink converge. Letters blend into the ground, and the threshold that recovers one part of a page destroys another."

[[challenge]]
title = "Decorative typography"
body = "Historic mastheads and showbills use hand-lettered, arched and ornamented letterforms that no character model has been trained on."

[[challenge]]
title = "Complex page layouts"
body = "Multi-column articles, mixed sizes, and text flowing around illustration. Finding the words and reading them in the right order are separate problems, and most engines solve only the first."

[[challenge]]
title = "Volume"
body = "Transcribing a collection by hand is not a plan. Whatever runs has to run unattended, and has to say something useful when it fails."

## --- The engines -------------------------------------------------------------
## `key` is the column stem in evaluation/ocr/benchmark.csv, so both renderers can
## look a row up without a translation table.
##
## `accent` names a design token, never a literal colour. The engine palette
## exists only to tell engines apart in charts and diagrams -- it is never used
## for interface state. tesseract and tesseract-auto share a hue because they
## are one engine, configured two ways.

[[engine]]
key = "tesseract"
label = "tesseract"
availability = "Free · local"
accent = "engine-blue"
body = "Traditional pattern-matching OCR, and the one everybody already has. Fast, predictable, and entirely dependent on being handed a well-prepared image."
best_for = "Typed and printed documents, and PDFs"
limits = "Decorative faces, faded scans, anything multi-column"

[[engine]]
key = "tesseract-auto"
label = "tesseract-auto"
availability = "Free · local"
accent = "engine-blue"
body = "The same engine with contrast and page-segmentation chosen per image instead of left at the default. Tuning the engine you have turned out to beat switching to a different one."
best_for = "Clean printed captions, postcard reverses, labels"
limits = "Bands fitted to this corpus; they need re-fitting more widely"

[[engine]]
key = "easyocr"
label = "easyocr"
availability = "Free · local"
accent = "engine-green"
body = "A neural detector and recogniser. Finds text regions the others miss, particularly on textured and low-contrast grounds, then struggles to put them in order."
best_for = "Low-contrast, textured illustration fronts"
limits = "No PDF support; weak on complex layouts"

[[engine]]
key = "easyocr-hy"
label = "easyocr-hy"
availability = "Free · local"
accent = "engine-green"
body = "EasyOCR’s detector with the project’s own Armenian recogniser behind it, and its lines put in column order before they are joined. It is measured here because it is a local backend, not because this corpus suits it: the corpus is English-language, and the model was trained on Armenian print."
best_for = "Armenian print, including multi-column pages"
limits = "Trained for Armenian; reads English-language material poorly"

[[engine]]
key = "paddle"
label = "paddle"
availability = "Free · local"
accent = "engine-purple"
body = "Baidu’s detection-and-recognition pipeline. Strong word coverage on dense images, and the best local reader of small type on a busy sheet."
best_for = "Dense small type, playbills, image pages"
limits = "No PDF support; character order suffers on ornamental type"

[[engine]]
key = "paddle-vl"
label = "paddle-vl"
availability = "Free · local"
accent = "engine-rose"
body = "A document vision-language model rather than a detector and classifier: it generates the transcript from the image instead of recognising each glyph in turn. It reads the dense multi-column pages this corpus is hardest on, and reads PDFs and multi-page TIFFs directly."
best_for = "Dense newsprint, multi-column pages, documents rather than images"
limits = "Minutes per page, not seconds — batch work only; opt-in to auto-local"

[[engine]]
key = "marker"
label = "marker"
availability = "Free · local"
accent = "engine-orange"
body = "A document-to-Markdown converter rather than an OCR engine: it models the page as structure — headings, columns, tables — and reads within it."
best_for = "Multi-page PDFs; multi-column articles needing clean output"
limits = "Slow on ordinary hardware; reads image-heavy pages as figures"

[[engine]]
key = "vision"
label = "vision"
availability = "Free · local · macOS"
accent = "engine-teal"
body = "Apple’s on-device recogniser, through the Vision framework. It ships with macOS — no weights to download, no first-call penalty — so on a Mac it joins the fan-out at essentially no cost and reads clean print quickly."
best_for = "Clean printed type on a Mac, at zero setup cost"
limits = "macOS only; no PDF support; sparse, unordered output on complex layouts"

[[engine]]
key = "auto-local"
label = "auto-local"
availability = "Free · local · routing"
accent = "clay"
body = "Not a standalone engine. It runs every local engine eligible for the file, scores the transcripts with no reference text, and keeps the best one. Per file, not per batch."
best_for = "Mixed collections, run unattended, nothing leaving the machine"
limits = "Slower by definition; its selection heuristic still loses ground"

[[engine]]
key = "claude"
label = "claude"
availability = "API · paid · ceiling reference"
accent = "ink-soft"
ceiling = true
body = "A vision model, and the source of the reference transcripts every other engine is scored against — including its own. Its column is self-consistency, not accuracy, and it is excluded from every ‘best local’ comparison on this page."
best_for = "Material nothing local reads: ornamental type, multi-column"
limits = "Per-page cost, an internet connection, material leaving site"

