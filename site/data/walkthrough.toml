challenge = "Curved and arched hand-lettered display type, colour on colour, with caption text at the bottom in a size the scan barely holds. Nothing local reads it — plain Tesseract returns essentially nothing at all. The widest gap in the corpus between what a local engine manages and what a vision model does."

