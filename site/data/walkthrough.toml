challenge = "Dense multi-column newsprint under a heavy display masthead, on aged low-contrast paper. Every local engine finds most of the words and then reads them in the wrong order, so recall holds up while character similarity collapses. Finding the text and understanding the page are different problems, and this is the document that separates them."

